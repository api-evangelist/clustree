name: Clustree
description: 'Clustree was a French HR-technology startup founded in 2014 that built an AI-powered
  skills engine and a multilingual skills ontology (over 53,000 verified skills consolidated from
  more than one billion job skills) used to match employees to internal roles and mobility opportunities.
  It was acquired by Cornerstone OnDemand in early 2020 (approximately $18.5M, all-cash) and its
  technology was folded into Cornerstone''s People Intelligence / Skills platform. The independent
  Clustree brand is discontinued: clustree.com no longer serves a website and there is no live
  developer portal, public API, documentation, SDK, or package registry presence under the Clustree
  name. This profile is retained as a network identity/lead record only.'
